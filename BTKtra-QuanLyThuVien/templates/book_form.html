{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if editing else 'Thêm' }} sách · Quản lý sách{% endblock %}
{% block body %}
<h1>{{ 'Sửa sách' if editing else 'Thêm sách' }}</h1><p class="sub">&nbsp;</p>
<form method="post" class="card" style="max-width:640px">
 <label for="title" style="margin-top:0">Tên sách</label>
 <input id="title" name="title" value="{{ book.title or '' }}" required autofocus>
 <div class="grid2">
  <div><label for="author">Tác giả</label><input id="author" name="author" value="{{ book.author or '' }}"></div>
  <div><label for="category_id">Danh mục</label>
   <select id="category_id" name="category_id" required>
    <option value="">Chọn danh mục</option>
    {% for c in cats %}<option value="{{ c.id }}" {{ 'selected' if c.id|string == (book.category_id or '')|string }}>{{ c.name }}</option>{% endfor %}
   </select></div>
  <div><label for="year">Năm xuất bản</label><input id="year" name="year" type="number" min="1000" max="2100" value="{{ book.year or '' }}"></div>
  <div><label for="price">Giá (đồng)</label><input id="price" name="price" type="number" min="0" step="1000" value="{{ book.price if book.price is not none else 0 }}" required></div>
  <div><label for="quantity">Số lượng</label><input id="quantity" name="quantity" type="number" min="0" value="{{ book.quantity if book.quantity is not none else 1 }}" required></div>
 </div>
 <p style="margin-bottom:0;display:flex;gap:10px">
  <button class="btn">Lưu sách</button><a class="btn ghost" href="{{ url_for('books') }}">Huỷ</a></p>
</form>{% endblock %}
