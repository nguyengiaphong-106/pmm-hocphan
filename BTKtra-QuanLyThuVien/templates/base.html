<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Quản lý sách{% endblock %}</title>
<style>
:root{--ink:#1d2433;--muted:#667085;--line:#dfe3ea;--paper:#f6f7f9;--card:#fff;
--accent:#0f766e;--accent-dark:#0b5a54;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{background:var(--ink);color:#fff}
.bar{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:28px;height:56px}
.brand{font-weight:700;font-size:18px;color:#fff;text-decoration:none}
nav a{color:#c9d1e0;text-decoration:none;margin-right:18px;padding:18px 0;display:inline-block}
nav a:hover,nav a.on{color:#fff;box-shadow:inset 0 -3px 0 var(--accent)}
main{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 6px} h2{font-size:18px;margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;
padding:8px 14px;border-radius:6px;font:inherit;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--accent)} .btn.ghost:hover{background:#eef7f6}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)} .btn.danger:hover{background:#fef3f2}
.btn.sm{padding:4px 10px;font-size:14px}
.acts{display:flex;gap:8px;justify-content:flex-end} .acts form{margin:0}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c5cbd6;border-radius:6px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:3px solid #99d5cf;outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.msg{padding:10px 14px;border-radius:6px;margin-bottom:16px;border:1px solid}
.msg.ok{background:#ecfdf3;border-color:#abefc6;color:var(--ok)}
.msg.error{background:#fef3f2;border-color:#fecdca;color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;padding:7px 0}
.row a{color:var(--ink);text-decoration:none;font-weight:600}
.track{background:#e8ecf1;border-radius:4px;height:14px;overflow:hidden}
.fill{background:var(--accent);height:100%;border-radius:4px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filters select{width:auto;min-width:200px}.filters input{width:240px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.two,.grid2{grid-template-columns:1fr}
.row{grid-template-columns:110px 1fr 56px}.bar{gap:14px}}
</style></head><body>
<header><div class="bar"><a class="brand" href="{{ url_for('dashboard') }}">Quản lý sách</a>
<nav>
<a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint=='dashboard' }}">Tổng quan</a>
<a href="{{ url_for('categories') }}" class="{{ 'on' if request.endpoint.startswith('categor') }}">Danh mục</a>
<a href="{{ url_for('books') }}" class="{{ 'on' if request.endpoint.startswith('book') }}">Sách</a>
</nav></div></header>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, m in msgs %}<div class="msg {{ cat }}" role="status">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main></body></html>
