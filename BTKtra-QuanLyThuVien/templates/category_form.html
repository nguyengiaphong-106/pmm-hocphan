{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if editing else 'Thêm' }} danh mục · Quản lý sách{% endblock %}
{% block body %}
<h1>{{ 'Sửa danh mục' if editing else 'Thêm danh mục' }}</h1><p class="sub">&nbsp;</p>
<form method="post" class="card" style="max-width:560px">
 <label for="name" style="margin-top:0">Tên danh mục</label>
 <input id="name" name="name" value="{{ cat.name or '' }}" required autofocus>
 <label for="description">Mô tả</label>
 <textarea id="description" name="description" rows="3">{{ cat.description or '' }}</textarea>
 <p style="margin-bottom:0;display:flex;gap:10px">
  <button class="btn">Lưu danh mục</button><a class="btn ghost" href="{{ url_for('categories') }}">Huỷ</a></p>
</form>{% endblock %}
