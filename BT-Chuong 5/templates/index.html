<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Bài Tập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 360px;
        }
        h2 { margin-bottom: 25px; color: #333; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Danh Sách Bài Tập</h2>
    <div class="btn-group">
        <a href="/bai1" class="btn">Bài 1: Máy tính cơ bản</a>
        <a href="/bai2" class="btn">Bài 2: Tính điểm học phần</a>
        <a href="/bmi" class="btn">Bài 3: Tính chỉ số BMI</a>
    </div>
</div>

</body>
</html>
