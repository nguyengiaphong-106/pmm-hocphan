
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sông Hương Coffee{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #38291f;
            background: #fcfaf6;
            line-height: 1.7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 8%;
            background: #38291f;
        }

        .brand {
            color: #f5e8d5;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #f5e8d5;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #d8ad79;
        }

        main {
            max-width: 1000px;
            min-height: 65vh;
            margin: 55px auto;
            padding: 0 25px;
        }

        h1 {
            margin: 8px 0 16px;
            font-size: 42px;
            line-height: 1.2;
        }

        h2 {
            margin-top: 0;
        }

        .eyebrow {
            color: #98724e;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .home-button {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 7px;
            background: #68452f;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .home-button:hover {
            background: #38291f;
        }

        .info-panel {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            background: #f3ede3;
        }

        .menu-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            padding: 25px;
            border: 1px solid #e8dfd2;
            border-radius: 12px;
            background: white;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-number {
            color: #98724e;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .card h3 {
            margin: 14px 0 8px;
        }

        .price {
            color: #81522e;
            font-size: 19px;
            font-weight: bold;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 35px 0;
        }

        .pagination a,
        .pagination strong {
            display: inline-block;
            min-width: 36px;
            padding: 6px 11px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
        }

        .pagination a {
            color: #68452f;
            background: #f0e7da;
        }

        .pagination a:hover {
            background: #e3d1ba;
        }

        .pagination strong {
            color: white;
            background: #68452f;
        }

        footer {
            padding: 30px 20px;
            background: #38291f;
            color: #e8dccc;
            text-align: center;
            font-size: 13px;
        }

        footer p {
            margin: 5px 0;
        }

        .footer-brand {
            color: #f5e8d5;
            font-size: 18px;
            font-weight: bold;
        }

        .signature {
            margin-top: 18px;
            color: #d8ad79;
        }

        .copyright {
            color: #bba994;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                gap: 15px;
            }

            h1 {
                font-size: 32px;
            }

            .menu-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    {% include "_navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "_footer.html" %}
</body>
</html>
